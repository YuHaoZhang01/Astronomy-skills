[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "supernova-sim-studio"
version = "0.1.0"
description = "Local-first web workbench and CLI for SNEC-family supernova simulations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
snstudio = "snstudio.cli:studio_app"
snctl = "snstudio.cli:ctl_app"

[tool.hatch.build.targets.wheel]
packages = ["src/snstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/snstudio/cli.py" = ["B008"] # Typer declares CLI metadata through parameter defaults.
